name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: understanding-linux/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: understanding-linux

      - name: Build
        run: npm run build
        working-directory: understanding-linux

      - name: Copy index.html to 404.html for SPA routing
        run: cp understanding-linux/dist/index.html understanding-linux/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: understanding-linux/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
